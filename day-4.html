    let activeCardIndex = 0;
    let autoPronounce = false;
    let isShuffled = false;
    let filteredIndices = vocabularyList.map((_, i) => i);
    let selectedCategoryId = 0;

    function pronounceSpeech(textString, rateValue = 0.85) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(textString.replace(/<[^>]*>?/gm, ''));
      u.lang = 'en-US';
      u.rate = rateValue;
      const btn = document.getElementById('pronounceMainBtn');
      const title = document.getElementById('vocabWord');
      u.onstart = () => { if (btn) btn.classList.add('audio-active'); if (title) title.classList.add('speaking-glow'); };
      u.onend = u.onerror = () => { if (btn) btn.classList.remove('audio-active'); if (title) title.classList.remove('speaking-glow'); };
      window.speechSynthesis.speak(u);
    }

    function speakCurrentWord() {
      const o = vocabularyList[filteredIndices[activeCardIndex]];
      if (o) pronounceSpeech(o.word, 0.85);
    }

    function speakSentence() {
      const o = vocabularyList[filteredIndices[activeCardIndex]];
      if (o) pronounceSpeech(o.sentenceEn, 0.9);
    }

    function toggleAutoPronounce() {
      autoPronounce = !autoPronounce;
      const status = document.getElementById('autoSpeakStatus');
      const btn = document.getElementById('autoSpeakToggle');
      if (autoPronounce) {
        status.innerText = "自動朗讀: 開";
        btn.classList.add('bg-teal-600', 'text-white', 'border-teal-500');
        btn.classList.remove('bg-slate-800', 'text-slate-300');
        speakCurrentWord();
      } else {
        status.innerText = "自動朗讀: 關";
        btn.classList.remove('bg-teal-600', 'text-white', 'border-teal-500');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      }
    }

    function toggleShuffle() {
      isShuffled = !isShuffled;
      const btn = document.getElementById('shuffleBtn');
      if (isShuffled) {
        btn.classList.add('bg-teal-600', 'text-white', 'border-teal-500');
        btn.classList.remove('bg-slate-800', 'text-slate-300');
        for (let i = filteredIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [filteredIndices[i], filteredIndices[j]] = [filteredIndices[j], filteredIndices[i]];
        }
      } else {
        btn.classList.remove('bg-teal-600', 'text-white', 'border-teal-500');
        btn.classList.add('bg-slate-800', 'text-slate-300');
        switchCategory(selectedCategoryId);
        return;
      }
      activeCardIndex = 0;
      renderFlashcard();
      buildDirectoryUI();
    }

    function renderFlashcard() {
      const card = vocabularyList[filteredIndices[activeCardIndex]];
      if (!card) return;

      const stage = document.getElementById('cardScrollBody');
      if (stage) stage.scrollTop = 0;

      document.getElementById('badgeCategory').innerText = card.categoryName;
      document.getElementById('badgeLevel').innerText = card.level;
      document.getElementById('cardIndexLabel').innerText = `${String(activeCardIndex + 1).padStart(2, '0')} / ${String(filteredIndices.length).padStart(2, '0')}`;
      document.getElementById('deckProgressBar').style.width = `${((activeCardIndex + 1) / filteredIndices.length) * 100}%`;

      document.getElementById('vocabWord').innerText = card.word;
      document.getElementById('vocabPhonetic').innerText = card.phonetic;
      document.getElementById('vocabSyllables').innerText = card.syllables;
      document.getElementById('vocabPos').innerText = card.pos;
      document.getElementById('vocabMeaning').innerText = card.meaning;

      const cmpBlock = document.getElementById('confusionComparisonBlock');
      const cmpContainer = document.getElementById('confusionCardsContainer');
      if (card.comparison) {
        cmpBlock.classList.remove('hidden');
        cmpContainer.innerHTML = `
          <div class="grid grid-cols-2 gap-2 bg-white/95 rounded-xl p-2.5 border border-amber-200 shadow-xs">
            <div class="bg-teal-50/70 border border-teal-200/90 rounded-lg p-2 flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="font-en font-black text-slate-900 text-sm truncate">${card.word}</span>
                <button onclick="pronounceSpeech('${card.word}', 0.85)" class="w-6 h-6 rounded-full bg-teal-100 hover:bg-teal-200 text-teal-700 flex items-center justify-center shrink-0 text-[10px]" title="聽發音"><i class="fa-solid fa-volume-high"></i></button>
              </div>
              <div class="mt-1">
                <span class="font-mono text-[10px] text-slate-500 font-semibold">${card.phonetic}</span>
                <p class="text-xs text-teal-900 font-bold mt-0.5 leading-tight">${card.meaning}</p>
              </div>
            </div>
            <div class="bg-rose-50/70 border border-rose-200/90 rounded-lg p-2 flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="font-en font-black text-rose-950 text-sm truncate">${card.comparison.confusedWith}</span>
                <button onclick="pronounceSpeech('${card.comparison.confusedWith}', 0.85)" class="w-6 h-6 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-700 flex items-center justify-center shrink-0 text-[10px]" title="聽發音"><i class="fa-solid fa-volume-high"></i></button>
              </div>
              <div class="mt-1">
                <span class="font-mono text-[10px] text-rose-500 font-semibold">${card.comparison.confusedPhonetic}</span>
                <p class="text-xs text-rose-900 font-bold mt-0.5 leading-tight">${card.comparison.confusedMeaning}</p>
              </div>
            </div>
          </div>
          <div class="bg-amber-100/70 border border-amber-300/80 rounded-xl px-3 py-2 text-xs text-amber-950 leading-relaxed font-medium">
            <span class="font-bold text-amber-900"><i class="fa-solid fa-key text-[11px] mr-1 text-amber-700"></i>破題心法：</span>${card.comparison.mnemonic}
          </div>
        `;
      } else {
        cmpBlock.classList.add('hidden');
      }

      document.getElementById('etymologyHeader').innerText = card.etymologyHeader + "：";
      document.getElementById('etymologyContent').innerText = card.etymologyDesc;

      document.getElementById('collocationBox').innerHTML = card.collocations.map(col => `
        <div class="flex items-start gap-2">
          <span class="text-teal-600 font-bold leading-tight mt-0.5">•</span>
          <span class="leading-relaxed flex-1">${col}</span>
        </div>
      `).join('');

      document.getElementById('sentenceEnText').innerHTML = card.sentenceEn.replace(new RegExp(`\\b${card.word}\\b`, 'gi'), `<b class="text-teal-700 underline decoration-teal-300 decoration-2 underline-offset-2">$1</b>`);
      document.getElementById('sentenceZhText').innerText = card.sentenceZh;

      const famBlock = document.getElementById('familyBlock');
      const famContainer = document.getElementById('familyContainer');
      if (card.family && card.family.length > 0) {
        famBlock.classList.remove('hidden');
        famContainer.innerHTML = card.family.map(fam => `
          <div class="flex items-center justify-between bg-white/95 p-2.5 rounded-xl border border-teal-100 shadow-xs">
            <div class="flex-1 min-w-0 pr-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-slate-900 font-en text-xs sm:text-sm">${fam.word}</span>
                <span class="text-[10px] text-teal-700 font-bold px-1.5 py-0.5 bg-teal-100 rounded font-mono">${fam.pos}</span>
                <span class="text-[10px] text-slate-500 font-mono">${fam.syllables}</span>
              </div>
              <p class="text-slate-600 text-[11px] sm:text-xs mt-0.5 truncate">${fam.meaning}</p>
            </div>
            <button onclick="pronounceSpeech('${fam.word}', 0.85)" class="w-7 h-7 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-600 flex items-center justify-center shrink-0 active:scale-90 transition text-xs" title="聆聽發音"><i class="fa-solid fa-volume-high"></i></button>
          </div>
        `).join('');
      } else {
        famBlock.classList.add('hidden');
      }

      if (autoPronounce) setTimeout(speakCurrentWord, 250);
    }

    function nextCard() { activeCardIndex = (activeCardIndex < filteredIndices.length - 1) ? activeCardIndex + 1 : 0; renderFlashcard(); }
    function prevCard() { activeCardIndex = (activeCardIndex > 0) ? activeCardIndex - 1 : filteredIndices.length - 1; renderFlashcard(); }

    function switchCategory(catId) {
      selectedCategoryId = catId;
      isShuffled = false;
      const shuffleBtn = document.getElementById('shuffleBtn');
      if (shuffleBtn) { shuffleBtn.classList.remove('bg-teal-600', 'text-white', 'border-teal-500'); shuffleBtn.classList.add('bg-slate-800', 'text-slate-300'); }
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = (parseInt(btn.dataset.id) === catId)
          ? "cat-btn px-3.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-sm font-bold"
          : "cat-btn px-3.5 py-1 rounded-full whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium";
      });
      filteredIndices = (catId === 0) ? vocabularyList.map((_, i) => i) : vocabularyList.map((item, i) => item.categoryId === catId ? i : -1).filter(i => i !== -1);
      activeCardIndex = 0;
      renderFlashcard();
      buildDirectoryUI();
    }

    function toggleModal(show) {
      const m = document.getElementById('directoryModal');
      if (show) {
        buildDirectoryUI();
        m.classList.remove('hidden');
        setTimeout(() => document.getElementById('dirSearchInput').focus(), 150);
      } else {
        m.classList.add('hidden');
      }
    }

    function jumpToWord(fullListIndex) {
      let idx = filteredIndices.indexOf(fullListIndex);
      if (idx === -1) { switchCategory(0); idx = fullListIndex; }
      activeCardIndex = idx;
      renderFlashcard();
      toggleModal(false);
    }

    function filterDirectoryList() {
      buildDirectoryUI(document.getElementById('dirSearchInput').value.toLowerCase().trim());
    }

    function buildDirectoryUI(query = '') {
      const container = document.getElementById('directoryListItems');
      const items = vocabularyList.filter(item => {
        if (!query) return true;
        const cmpMatch = item.comparison ? (item.comparison.confusedWith.toLowerCase().includes(query) || item.comparison.confusedMeaning.toLowerCase().includes(query)) : false;
        return item.word.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query) || item.phonetic.toLowerCase().includes(query) || cmpMatch;
      });
      if (items.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">查無符合的單字</div>`;
        return;
      }
      container.innerHTML = items.map(item => {
        const fullIndex = item.id - 1;
        const isCur = filteredIndices[activeCardIndex] === fullIndex;
        return `
          <div onclick="jumpToWord(${fullIndex})" class="p-2.5 rounded-xl border flex items-center justify-between cursor-pointer transition active:scale-98 ${isCur ? 'bg-teal-50 border-teal-300 shadow-xs' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              <span class="font-mono text-xs font-bold text-slate-400 w-5 shrink-0">${String(item.id).padStart(2, '0')}</span>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-en font-bold text-slate-900 text-xs sm:text-sm">${item.word}</span>
                  <span class="text-[10px] text-slate-500 font-mono">${item.syllables}</span>
                  ${item.comparison ? `<span class="text-[9px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.2 rounded border border-amber-300">vs ${item.comparison.confusedWith}</span>` : ''}
                </div>
                <p class="text-xs text-slate-600 truncate mt-0.5">${item.meaning}</p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); pronounceSpeech('${item.word}', 0.85)" class="w-7 h-7 rounded-full bg-white hover:bg-teal-100 text-teal-600 flex items-center justify-center shrink-0 border border-slate-200 text-xs"><i class="fa-solid fa-volume-high"></i></button>
          </div>
        `;
      }).join('');
    }

    let touchStartX = 0;
    const stage = document.getElementById('cardScrollBody');
    stage.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    stage.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (diff < -50) nextCard();
      else if (diff > 50) prevCard();
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextCard();
      else if (e.key === 'ArrowLeft') prevCard();
      else if (e.key === 'p' || e.key === 'P') speakCurrentWord();
    });

    window.onload = () => { autoScaleViewport(); renderFlashcard(); };
  </script>
</body>
</html>
